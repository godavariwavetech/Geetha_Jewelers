name: iOS TestFlight (reusable)

# Shared build-and-upload job. Called by ios-geetajewellers.yml.
on:
  workflow_call:
    inputs:
      app_dir:
        description: "App folder in the repo ('.' = repo root)"
        required: false
        default: "."
        type: string

jobs:
  testflight:
    name: TestFlight
    # Never build/upload from main or any other branch.
    if: github.ref == 'refs/heads/ios-deployment'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ inputs.app_dir }}
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      IOS_MATCH_READONLY: ${{ vars.MATCH_READONLY }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are set
        run: |
          for v in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_CONTENT; do
            if [ -z "${!v}" ]; then echo "::error title=Missing secret::$v is empty"; missing=1; fi
          done
          [ -z "$missing" ]

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ inputs.app_dir }}/package-lock.json

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ inputs.app_dir }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ${{ inputs.app_dir }}/ios/Pods
          key: pods-${{ hashFiles(format('{0}/ios/Podfile.lock', inputs.app_dir)) }}
          restore-keys: pods-

      - name: Install Pods
        working-directory: ${{ inputs.app_dir }}/ios
        run: |
          set -o pipefail
          bundle exec pod install 2>&1 | tee ../ci-output.log

      - name: Build and upload to TestFlight
        run: |
          set -o pipefail
          bundle exec fastlane ios beta 2>&1 | tee ci-output.log

      - name: Report error
        if: failure()
        run: |
          # Surface the tail of the log as an annotation so it is visible without opening the logs
          [ -f ci-output.log ] || exit 0
          tail -n 80 ci-output.log | sed 's/\x1b\[[0-9;]*m//g' > tail.txt
          msg=$(sed -e 's/%/%25/g' tail.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=build failed::$msg"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: geetajewellers-ipa
          path: ${{ inputs.app_dir }}/build/*.ipa
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geetajewellers-build-logs
          path: |
            /Users/runner/Library/Logs/gym
            /Users/runner/Library/Logs/fastlane
          retention-days: 7
